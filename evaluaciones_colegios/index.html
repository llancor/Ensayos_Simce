<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Inter,Arial,sans-serif;background:#f8fafc;color:#172554;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}.admin-access{position:fixed;top:22px;right:22px;z-index:5;display:inline-flex;align-items:center;gap:9px;border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;padding:10px 15px;font-weight:800;box-shadow:0 10px 28px #0f172a14;cursor:pointer}.admin-access i{color:#1d4ed8}.shell{width:min(620px,100%);text-align:center}.brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:30px}.brand-icon{width:92px;height:92px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 45px #0f172a14;border:1px solid #e2e8f0}.brand-icon i{font-size:44px;color:#1d4ed8}.brand-logo{width:100px;height:100px;object-fit:contain;border-radius:22px;background:#fff;padding:8px;box-shadow:0 16px 45px #0f172a14;border:1px solid #e2e8f0}.brand h1{font-size:clamp(28px,5vw,44px);line-height:1.05;color:#172554}.brand p{color:#475569;font-size:17px}.student-card{border:1px solid #e2e8f0;background:#fff;border-radius:22px;padding:34px 28px;box-shadow:0 18px 45px #0f172a12}.student-button{width:100%;min-height:230px;border:0;border-radius:24px;background:#fff;color:#172554;border:1px solid #cbd5e1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;box-shadow:0 12px 30px #0f172a12;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.student-button:hover{transform:translateY(-3px);box-shadow:0 18px 42px #0f172a18;border-color:#1d4ed8}.student-button i{font-size:74px;color:#1d4ed8}.student-button span{font-size:30px;font-weight:800}.student-card small{display:block;margin-top:18px;color:#64748b;font-weight:700}.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal-overlay.active{display:flex}.modal-box{background:#fff;border-radius:24px;padding:32px;width:min(430px,100%);box-shadow:0 30px 80px #0f172a35}.modal-icon{text-align:center;font-size:38px;color:#1d4ed8;margin-bottom:12px}.modal-box h2{text-align:center;color:#172554;margin-bottom:6px}.modal-box p{text-align:center;color:#64748b;margin-bottom:24px}.input-group{margin-bottom:16px;text-align:left}.input-group label{display:block;color:#475569;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}.input-group input{width:100%;padding:14px 16px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}.modal-actions{display:flex;gap:12px;margin-top:22px}.modal-actions button{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;cursor:pointer}.btn-cancel{background:#e2e8f0;color:#334155}.btn-submit{background:#1d4ed8;color:#fff}.modal-error{display:none;margin-top:14px;padding:10px;border-radius:10px;background:#fee2e2;color:#991b1b;font-weight:700;text-align:center}.modal-error.visible{display:block}.setup-link{display:none;margin-top:12px;color:#1d4ed8;font-weight:800;text-align:center}.setup-link.visible{display:block}@media(max-width:640px){body{align-items:flex-start;padding-top:78px}.admin-access{top:14px;right:14px}.student-button{min-height:190px}.student-button i{font-size:58px}.student-button span{font-size:25px}.modal-box{padding:24px}}
</style>
</head>
<body data-brand-page="Acceso">
<button class="admin-access" id="btnProfesor" type="button"><i class="fas fa-lock"></i><span>Acceso</span></button>
<main class="shell">
<section class="brand" aria-label="Identidad institucional">
<div class="brand-icon" data-brand-logo-fallback><i class="fas fa-school"></i></div>
<img class="brand-logo" data-brand-logo hidden alt="Logo del establecimiento">
<h1 data-brand="name">Pruebas Educativas</h1>
<p data-brand="welcome">Hola, bienvenido al sistema</p>
</section>
<section class="student-card">
<button class="student-button" id="btnAlumno" type="button"><i class="fas fa-user-graduate"></i><span>Ingreso estudiantes</span></button>
<small data-brand="institution-subtitle">Plataforma evaluativa</small>
</section>
</main>
<div class="modal-overlay" id="authModal">
<div class="modal-box">
<div class="modal-icon"><i class="fas fa-shield-alt"></i></div>
<h2>Acceso profesores y administración</h2>
<p>Ingresa con tus credenciales institucionales.</p>
<div class="input-group"><label for="modalSchool"><i class="fas fa-school"></i> Código del colegio</label><input type="text" id="modalSchool" placeholder="Vacío solo para superadministrador" autocomplete="organization"></div>
<div class="input-group"><label for="modalUser"><i class="fas fa-user"></i> Usuario</label><input type="text" id="modalUser" autocomplete="off"></div>
<div class="input-group"><label for="modalPass"><i class="fas fa-key"></i> Contraseña</label><input type="password" id="modalPass" autocomplete="current-password"></div>
<div class="modal-actions"><button class="btn-cancel" id="modalCancel" type="button">Cancelar</button><button class="btn-submit" id="modalSubmit" type="button">Ingresar</button></div>
<div class="modal-error" id="modalError">No se pudo iniciar sesión.</div>
<a class="setup-link" id="setupLink" href="instalar.php">Configurar administrador por primera vez</a>
</div>
</div>
<script>
const URL_PROFESORES='pruebas_educativas.php',URL_ALUMNOS='portal_estudiante.php',params=new URLSearchParams(location.search),requestedSchool=params.get('colegio')||'';
const btnProfesor=document.getElementById('btnProfesor'),btnAlumno=document.getElementById('btnAlumno'),modal=document.getElementById('authModal'),modalUser=document.getElementById('modalUser'),modalSchool=document.getElementById('modalSchool'),modalPass=document.getElementById('modalPass'),modalSubmit=document.getElementById('modalSubmit'),modalCancel=document.getElementById('modalCancel'),modalError=document.getElementById('modalError'),setupLink=document.getElementById('setupLink');
function showModal(){modal.classList.add('active');modalUser.value='';modalSchool.value=requestedSchool;modalPass.value='';modalError.classList.remove('visible');setupLink.classList.remove('visible');(modalSchool.value?modalUser:modalSchool).focus()}
function hideModal(){modal.classList.remove('active')}
function showAuthError(message,needsSetup){modalError.textContent=message;modalError.classList.add('visible');setupLink.classList.toggle('visible',Boolean(needsSetup))}
async function validateCredentials(){const user=modalUser.value.trim(),pass=modalPass.value;if(!user||!pass){showAuthError('Escribe el usuario y la contraseña.',false);return false}modalSubmit.disabled=true;modalSubmit.textContent='Ingresando…';modalError.classList.remove('visible');setupLink.classList.remove('visible');try{const response=await fetch('autenticacion.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',colegio:modalSchool.value.trim(),usuario:user,password:pass})});const result=await response.json();if(!response.ok||!result.ok)throw Object.assign(new Error(result.error||'No se pudo iniciar sesión.'),{needsSetup:result.needsSetup});window.location.href=result.redirect||URL_PROFESORES;return true}catch(error){showAuthError(error.message||'El servidor de autenticación no está disponible.',error.needsSetup);modalPass.value='';modalPass.focus();return false}finally{modalSubmit.disabled=false;modalSubmit.textContent='Ingresar'}}
btnProfesor.addEventListener('click',showModal);btnAlumno.addEventListener('click',()=>{window.location.href=requestedSchool?URL_ALUMNOS+'?colegio='+encodeURIComponent(requestedSchool):URL_ALUMNOS});modalSubmit.addEventListener('click',validateCredentials);modalCancel.addEventListener('click',hideModal);modal.addEventListener('click',e=>{if(e.target===modal)hideModal()});modalSchool.addEventListener('keydown',e=>{if(e.key==='Enter')modalUser.focus()});modalUser.addEventListener('keydown',e=>{if(e.key==='Enter')modalPass.focus()});modalPass.addEventListener('keydown',e=>{if(e.key==='Enter')validateCredentials()});
</script>
<script src="marca.js"></script>
</body>
</html>
