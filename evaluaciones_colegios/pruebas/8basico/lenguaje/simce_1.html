<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMCE 1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
.ph{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.ph-inner{max-width:900px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.ph-logo{width:40px;height:40px;background:rgba(255,255,255,.18);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ph-info{flex:1;min-width:0}
.ph-title{font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-meta{font-size:.73rem;opacity:.8;margin-top:2px}
.ph-timer{background:rgba(255,255,255,.15);border-radius:10px;padding:7px 14px;font-size:1.15rem;font-weight:700;font-family:monospace;flex-shrink:0;min-width:76px;text-align:center;transition:background .3s}
.ph-timer.warning{background:rgba(245,158,11,.4)}.ph-timer.danger{background:rgba(220,38,38,.6);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
.pm{max-width:900px;margin:0 auto;padding:24px 16px 60px}
.instr-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:13px 16px;margin-bottom:22px;font-size:.86rem;color:#1e40af;line-height:1.6;display:flex;gap:9px;align-items:flex-start}
.q-block{background:#fff;border-radius:14px;border:1.5px solid #e9ecef;padding:20px 22px;margin-bottom:14px;transition:border-color .15s}
.q-num{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:50%;background:#2563eb;color:#fff;font-size:.75rem;font-weight:700;margin-right:9px;flex-shrink:0;vertical-align:middle}
.q-hdr{display:flex;align-items:flex-start;gap:0;margin-bottom:13px}
.q-txt{font-size:.93rem;font-weight:600;color:#1e293b;line-height:1.55;flex:1}
.q-img{max-width:100%;max-height:260px;border-radius:10px;margin-bottom:11px;display:block}
.lec-btn{display:inline-flex;align-items:center;gap:6px;background:#ede9fe;color:#6d28d9;border:1.5px solid #ddd6fe;border-radius:8px;padding:5px 13px;font-size:.78rem;font-weight:600;cursor:pointer;margin-bottom:11px;font-family:inherit;border:none}
.opts{display:grid;gap:7px}
.opt{display:flex;align-items:flex-start;gap:9px;padding:10px 13px;border-radius:10px;border:1.5px solid #e9ecef;cursor:pointer;transition:all .15s;user-select:none}
.opt:hover{background:#f8fafc;border-color:#bfdbfe}.opt.sel{background:#eff6ff;border-color:#2563eb}
.opt.ok{background:#dcfce7;border-color:#16a34a;pointer-events:none}.opt.bad{background:#fee2e2;border-color:#dc2626;pointer-events:none}
.opt-l{display:flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:6px;background:#f1f5f9;font-size:.75rem;font-weight:700;color:#475569;flex-shrink:0;transition:background .15s}
.opt.sel .opt-l{background:#2563eb;color:#fff}.opt.ok .opt-l{background:#16a34a;color:#fff}.opt.bad .opt-l{background:#dc2626;color:#fff}
.opt-txt{font-size:.87rem;color:#334155;line-height:1.45;padding-top:3px;flex:1}
.opt-img{max-width:180px;border-radius:8px;margin-top:5px;display:block}
input[type=radio]{display:none}
.open-ans{width:100%;border:1.5px solid #e9ecef;border-radius:10px;padding:10px 13px;font-size:.87rem;font-family:inherit;color:#1e293b;resize:vertical;min-height:80px;outline:none}
.open-ans:focus{border-color:#2563eb}
.sub-wrap{text-align:center;margin-top:28px;padding:22px;background:#fff;border-radius:14px;border:1.5px solid #e9ecef}
.btn-sub{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:12px;padding:13px 38px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px}
.btn-sub:hover{opacity:.9}.btn-sub:disabled{opacity:.5;cursor:not-allowed}
.result{background:#fff;border-radius:16px;border:2px solid #e9ecef;padding:30px;text-align:center;display:none}
.result.show{display:block}
.res-icon{font-size:3.2rem;margin-bottom:10px}
.res-score{font-size:2rem;font-weight:800;color:#1e293b;margin:6px 0}
.res-nota{font-size:1rem;color:#64748b;margin-bottom:16px}
.res-badge{display:inline-block;padding:5px 18px;border-radius:20px;font-size:.88rem;font-weight:700;margin-bottom:20px}
.badge-ap{background:#dcfce7;color:#15803d}.badge-rp{background:#fee2e2;color:#b91c1c}
.prog{height:11px;background:#f1f5f9;border-radius:10px;overflow:hidden;margin:14px 0}
.prog-fill{height:100%;border-radius:10px;transition:width 1s ease}
.btn-rev{background:#f8fafc;border:1.5px solid #e9ecef;border-radius:9px;padding:9px 22px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;color:#475569;margin-top:10px}
.btn-rev:hover{background:#f1f5f9}
.lec-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.lec-ov.open{display:flex}
.lec-box{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lec-hdr{padding:15px 18px;border-bottom:1px solid #e9ecef;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.lec-ttl{font-weight:700;font-size:.92rem;color:#1e293b}
.lec-x{border:none;background:none;font-size:1.2rem;cursor:pointer;color:#64748b;line-height:1;padding:4px}
.lec-body{padding:18px;overflow-y:auto;font-size:.86rem;line-height:1.75;color:#334155}
@media(max-width:640px){.ph-inner{flex-wrap:wrap;gap:10px}.pm{padding:12px 10px 40px}.q-block{padding:14px 14px}}
</style>
</head>

azos – Marta es empujada."],"points":1,"required":true,"multiAnswer":false,"correctAnswer":"Marta levanta los brazos – Marta es empujada – Gerardo golpea a su amigo – el amigo de Gerardo se queda llorando.","correctAnswerIdx":1,"max":5,"minLabel":"","maxLabel":"","image":null,"optionImages":null,"mathMode":false,"indicador":"Compresión Lectora","lectura_id":"lec1"},{"id":"q4","type":"choice","question":"¿Qué hizo Marta cuando el ómnibus estuvo cerca?","options":["Se abalanzó sobre su amigo."," Se tiró hacia el ómnibus.","Bajó de la bicicleta.","Levantó los brazos"],"points":1,"required":true,"multiAnswer":false,"correctAnswer":"Levantó los brazos","correctAnswerIdx":3,"max":5,"minLabel":"","maxLabel":"","image":null,"optionImages":null,"mathMode":false,"indicador":"Compresión Lectora","lectura_id":"lec1"},{"id":"q5","type":"choice","question":" ¿A qué género literario pertenece este texto?","options":["Lírico."," Infantil.","Narrativo.","Dramático"],"points":1,"required":true,"multiAnswer":false,"correctAnswer":"Dramático","correctAnswerIdx":2,"max":5,"minLabel":"","maxLabel":"","image":null,"optionImages":null,"mathMode":false,"indicador":"Compresión Lectora","lectura_id":"lec1"},{"id":"q6","type":"choice","question":"Lee el siguiente fragmento del texto: “En esos casos yo sabía lo que tenía que hacer: meadelantaba por la izquierda, colocándome entre su máquina y el paso del vehículo”. ¿Quépalabra puede reemplazar a la palabra “máquina”, sin cambiar el sentido del fragmento?","options":["Auto."," Cuerpo."," Bicicleta.","Omnibus."],"points":1,"required":true,"multiAnswer":false,"correctAnswer":" Bicicleta.","correctAnswerIdx":2,"max":5,"minLabel":"","maxLabel":"","image":null,"optionImages":null,"mathMode":false,"indicador":"Compresión Lectora","lectura_id":"lec1"},{"id":"q7","type":"choice","question":"¿Para qué sirven las comillas en “hay chaleco para rato”? Para","options":["destacar que esa parte de la noticia es importante."," indicar que esas palabras están ex {"id":"lec1","titulo":"Bicicleta","contenido":"A veces salíamos los tres en bicicleta. Marta era muy nerviosa. Siempre que se\n\nacercaba un vehículo en sentido contrario, temblaba en su bicicleta, como si vacilase\nentre arrojarse bajo las ruedas que se acercaban o hacerlo directamente a la cuneta.\nEn esos casos yo sabía lo que tenía que hacer: me adelantaba por la izquierda,\ncolocándome entre su máquina y el paso del vehículo, de modo que pudiese sujetarla o\npor lo menos propinarle un empujón hacia la derecha.\nFue eso precisamente lo que pasó esa tarde. El ómnibus venía inclinado hacia\nnuestro lado y eso aumentó la nerviosidad de Marta. La vi vacilar dos veces\namenazadoramente. Cuando el ómnibus estaba ya sobre nosotros, levantó los brazos\naterrorizada. Se caía sin remedio y preferí empujarla a la cuneta.\nGerardo, que iba adelante y se había dado vuelta, alcanzó a distinguir mi\nademán, no mi intención. Bajó de la bicicleta y contempló el cuadro que formábamos:\nMarta, sucia de barro, con las rodillas ensangrentadas; yo, pasmado como un imbécil,\nsin atinar a ayudarla. Gerardo vino, le limpió las rodillas como pudo y acercándoseme,\nsin decir nada, casi tranquilo, me dio un tremendo puñetazo en la sien.\nNo sé qué hizo Marta ni qué dijo, si es que dijo algo. Creo recordar que subieron\nde nuevo a sus bicicletas y se fueron despacio, sin mirarme. Quedé un poco mareado,\ncon la impresión de que todo aquello era un malentendido. No me era posible sentir\nodio por un malentendido, por algo que más tarde seguramente se aclararía; pero\nnunca se aclaró. Nunca supieron ellos que me quedé ahí llorando, desconcertado,\nhasta que la noche me entumeció de frío.\nEste recuerdo siempre me acompaña."},{"id":"lec2","titulo":"Deportes","contenido":"Francisco “chaleco López” sufre desperfecto a pocos kilómetros de la meta\nA 22 kilómetros de la meta el piloto chileno sufrió un\ndesperfecto que le impidió terminar la competencia.\nEl motociclista nacional solo debía terminar la última etapa del Rally Dakar para asegurar el\ntercer lugar de la competencia; sin embargo, su moto sufrió un desperfecto que le impidió cumplir\ncon su objetivo.\nEl piloto se había desempeñado eficientemente en las etapas anteriores, de ahí la posibilidad\nde que obtuviese el tercer lugar si terminaba el último tramo. Las fallas de su Arprilia se lo\nimpidieron y solo llegó a la meta remolcado por otro piloto. Pese a la derrota, el representante\nnacional declaró que “hay chaleco para rato”.\nQuienes pudieron subir al podio en esta categoría fueron el piloto español Marc Coma,\nseguido por el francés Ciryl Deprés y en tercer lugar el portugués Herder Rodríguez"},{"id":"lec3","titulo":"Eco y Narciso","contenido":"Narciso, hijo del río Cefiso y de la ninfa Liríope era un joven muy hermoso que despreciaba a cualquier persona que manifestaba su amor hacia él. Un día, salió a cazar en compañía de sus amigos y de la ninfa Eco. Esta ninfa, había traicionado a la diosa Hera (por sus conductas con Júpiter y Juno), quien la condenó a pronunciar solo las últimas sílabas de lo que quería decir. Apenas Eco vio a Narciso, se enamoró perdidamente de él y comenzó a seguirlo en silencio. De pronto, Narciso advirtió que se había perdido y comenzó a gritar para saber dónde estaban sus acompañantes: –“¿Hay alguien aquí?– preguntó el muchacho. Eco se puso contenta y repitió: -¡Aquí!, ¡Aquí!- ya que solo podía pronunciar la última parte de lo que quería decir.\n\nNarciso se maravilló al oír aquella voz tan dulce y volvió a gritar: -“¿Quién eres?” -“...eres, eres” “¿Por qué huyes?” -“...huyes, huyes”- contestó. Como Eco se encontraba oculta entre los árboles, Narciso fue incapaz de verla, y desesperadamente gritó: -¡Ven!-. Eco, entusiasmada, después de repetir: -¡Ven!, ¡Ven!-, salió de su escondite y corriendo con los brazos abiertos se dirigió a su gran amor, Narciso. Cuando por fin se encontraron, Eco abrazó apasionadamente a Narciso, pero él se desilusionó al verla y la menospreció diciéndole que no la amaba. Eco, destrozada, deseó que cuando él se enamorara se desesperara tanto como ella lo estaba y la diosa de la Venganza, Némesis, oyó a Eco y la ayudó.\n\nUn día Narciso se asomó a una fuente y vio su reflejo en el agua. Cupido mandado por la diosa, le clavó una flecha e hizo que Narciso se enamorara de su propio reflejo, desesperándose porque no podía amarse a sí mismo. Incapaz de dirigir sus ojos a otra parte se le fueron los segundos, los minutos y las horas; hasta que por fin terminó arrojándose en las aguas de la fuente. Se cuenta que en el sitio donde Narciso cayó, creció una flor, que hizo honor a su nombre y a su memoria.\n\nSe dice que después de lo que le ocurrió a Narciso, Eco totalmente afligida se alejó, y buscó una cueva en la cual ocultarse. Y ahí permaneció, hasta que el tiempo la consumió, y solo quedó su voz. Las náyades, sus hermanas la llamaban llorando y Eco les respondía, pero nunca encontraron su cuerpo. Por eso es que a Eco se la escucha repitiendo las últimas palabras de los humanos por todo el mundo.\n\nFuente: http://laflordelapocalipsis.blogspot.com/2007/06/la-leyenda-de-eco-y-narciso.html\nAdaptación basada en una versión romana del texto “Las Metamorfosis” de Ovidio, julio 2011."},{"id":"lec4","titulo":"RECICLA Papel nuevo del viejo","contenido":"Esta es una manera de convertir periódicos viejos en papel reciclado.  \n\n1.- Rompe algunas hojas de periódicos y deja humedecer los pedazos en un poco de agua caliente.\n\n2.- Bate la mezcla hasta obtener una pasta.\n\n3.- Coloca la pasta sobre un papel secante o una toalla de papel y extiéndela de manera uniforme.\n\n4.- Coloca más papel secante o una toalla de papel sobre la pasta.  \n\n5.- Aplástala con un rodillo y después pide a un adulto que la planche.\n\n6.- Cuando esté seca, retira cuidadosamente el papel secante o las toallas de papel"},{"id":"lec5","titulo":"Poema","contenido":"Te has ido.\nPero danzó el pez rojo de tus labios\nprisionero de la red de los míos. \nEstábamos entre cercos de madera\ny soñolientos cerezos.\nTú me besabas\nagua de la luz volcada de la copa del silencio.\nTe has ido.\nMi frente marchita la corteza de los cerezos.\nMi casa cierra sus párpados\nlámpara cegada por las manos del invierno.\nTe has ido.\nMis labios lloran lentamente.\nMis labios lloran sobre la tierra mojada.\nAprenderán a ser raíces\ny será el olvido.\n\n\nJorge Teillier\nPara ángeles y gorriones\nEditorial Universitaria"}],"correctas":{"q1":"El malentendido.","q2":"siempre se acuerda de que sus amigos no comprendieron su intención.","q3":"Marta levanta los brazos – Marta es empujada – Gerardo golpea a su amigo – el amigo de Gerardo se queda llorando.","q4":"Levantó los brazos","q5":"Dramático","q6":" Bicicleta.","q7":"marcar las palabras del piloto Francisco López","q8":"Aseguraba el tercer lugar de la competencia.","q9":"la motocicleta del piloto.","q10":"Sintetizar la información que se entregará.","q11":" presenta un tema; mientras el segundo lo profundiza.","q12":"Noticia.","q13":"La diosa Némesis.","q14":"saber dónde estaban sus amigos.","q15":"Narciso se enamoró de su propio reflejo en el agua de la fuente y murió.","q16":"La diosa Némesis le clavó una flecha a Narciso.","q17":"Mientras estaba escondida y le respondía a todas sus preguntas.","q18":"La vanidad impide el amor.","q19":"Enseñar al lector a reciclar papel.","q20":" batirla, luego extenderla, después aplastarla y finalmente plancharla.","q21":" Aplasta la pasta con un rodillo.","q22":"Señala una característica.","q23":"instructivo","q24":" Ejemplificar algunos pasos de las instrucciones.","q25":"Nostálgico.","q26":"El dolor que deja la partida de un amor.","q27":"la lengua.","q29":" Personificación.","q30":" Lírico.","q31":" Evitar la propagación de plagas y enfermedades en nuestro país."}}</script>

<script>
window._QZ=(function(){
var D=JSON.parse(document.getElementById("qd").textContent);
var C=D.config,PQ=D.preguntas,LEC=D.lecturas||[],COR=D.correctas||{};
var LM={}; LEC.forEach(function(l){if(l.id)LM[l.id]=l;});
var ALPHA=["A","B","C","D","E","F","G","H"];
var done=false;
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function rm(el){try{renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:!0},{left:"$",right:"$",display:!1},{left:"\\(",right:"\\)",display:!1},{left:"\\[",right:"\\]",display:!0}],throwOnError:!1});}catch(e){}}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
// Setup header
document.title=C.titulo;
document.getElementById("ph-t").textContent=C.titulo;
var m=[C.asignatura,C.curso,C.docente?"Prof. "+C.docente:""].filter(Boolean).join(" · ");
document.getElementById("ph-m").textContent=m;
if(C.instrucciones){document.getElementById("instr").innerHTML='<div class="instr-box"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>'+esc(C.instrucciones)+'</span></div>';}
// Randomize
var QS=C.randomQuestions?shuffle(PQ):PQ.slice();
if(C.randomOptions){QS=QS.map(function(q){if(q.type!=="choice"&&q.type!=="truefalse")return q;var opts=q.options?q.options.slice():[];var imgs=q.optionImages||{};var idx=opts.map(function(_,i){return i;});for(var i=idx.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idx[i];idx[i]=idx[j];idx[j]=t;}var no=idx.map(function(i){return opts[i];});var ni={};idx.forEach(function(oi,ni2){var v=imgs[oi]||imgs[String(oi)];if(v)ni[ni2]=v;});return Object.assign({},q,{options:no,optionImages:ni});});}
// Render questions
var qs=document.getElementById("qs");
var parts=[];
QS.forEach(function(q,i){
  var tp=q.type||"choice";
  var txt=q.question||q.text||q.title||("Pregunta "+(i+1));
  var h='<div class="q-block" id="qb'+i+'">'+
    '<div class="q-hdr"><span class="q-num">'+(i+1)+'</span><span class="q-txt" id="qt'+i+'">'+ esc(txt) +'</span></div>';
  if(q.lectura_id&&LM[q.lectura_id]){var _lid=String(q.lectura_id).replace(/&/g,"&amp;").replace(/"/g,"&quot;");h+='<button class="lec-btn" data-lid="'+_lid+'" onclick="_QZ.showLec(this.dataset.lid)">&#x1F4D6; Ver texto: '+ esc(LM[q.lectura_id].titulo||"Lectura") +'</button>';}
  if(q.image){h+='<img class="q-img" src="'+q.image+'" alt="">';
  }
  if(tp==="choice"||tp==="truefalse"){
    var opts=q.options||[];if(tp==="truefalse"&&!opts.length)opts=["Verdadero","Falso"];
    h+='<div class="opts" id="op'+i+'">';
    opts.forEach(function(o,j){
      var lt=ALPHA[j]||String(j+1);
      var im=(q.optionImages||{})[j]||(q.optionImages||{})[String(j)];
      h+='<div class="opt" id="o'+i+"_"+j+'" onclick="_QZ.sel('+i+','+j+',this)">'+
        '<input type="radio" name="q'+i+'" value="'+esc(o)+'">'+
        '<div class="opt-l" id="ol'+i+"_"+j+'">'+lt+'</div>'+
        '<div class="opt-txt" id="ot'+i+"_"+j+'">'+esc(o)+(im?'<br><img class="opt-img" src="'+im+'" alt="">':"")+"</div></div>";
    });
    h+='</div>';
  } else {
    h+='<textarea class="open-ans" id="oa'+i+'" placeholder="Escribe tu respuesta aquí…"></textarea>';
  }
  h+='</div>';
  parts.push(h);
});
qs.innerHTML=parts.join("");
// Render math
QS.forEach(function(q,i){
  var e=document.getElementById("qt"+i);if(e)rm(e);
  (q.options||[]).forEach(function(_,j){var e=document.getElementById("ot"+i+"_"+j);if(e)rm(e);});
});
document.getElementById("sub-wrap").style.display="";
// Timer (declared before module so tick() can reference both)
var timerEl=document.getElementById("timer");
var rem=(C.tiempoMinutos||45)*60;
var iv=null;
function pad(n){return n<10?"0"+n:String(n);}
function tick(){
  var min=Math.floor(rem/60),sec=rem%60;
  timerEl.textContent=pad(min)+":"+pad(sec);
  if(rem<=0){clearInterval(iv);if(!done&&module)module.submit(true);}
  else if(rem<=60)timerEl.className="ph-timer danger";
  else if(rem<=300)timerEl.className="ph-timer warning";
  rem--;
}
var module={
sel:function(qi,oi,el){
  if(done)return;
  document.querySelectorAll("#op"+qi+" .opt").forEach(function(o){o.classList.remove("sel");});
  el.classList.add("sel");
},
showLec:function(lid){
  var l=LM[lid];if(!l)return;
  document.getElementById("lec-t").textContent=l.titulo||"Texto de lectura";
  var b=document.getElementById("lec-b");
  b.innerHTML="<p>"+esc(l.contenido||l.texto||"")+"</p>";
  rm(b);
  document.getElementById("lec-ov").classList.add("open");
},
closeLec:function(){document.getElementById("lec-ov").classList.remove("open");},
submit:function(timeout){
  if(done)return;done=true;
  clearInterval(iv);
  // Collect
  var ans={};
  QS.forEach(function(q,i){
    var tp=q.type||"choice";
    var qid=q.id||("q"+i);
    if(tp==="choice"||tp==="truefalse"){
      var el=document.querySelector('#op'+i+' .opt.sel input[type="radio"]');
      ans[qid]=el?el.value:null;
    } else {
      var ta=document.getElementById("oa"+i);
      ans[qid]=ta?(ta.value.trim()||null):null;
    }
  });
  // Score
  var correct=0,total=0;
  QS.forEach(function(q,i){
    var tp=q.type||"choice";
    if(tp!=="choice"&&tp!=="truefalse")return;
    total++;
    var qid=q.id||("q"+i);
    var ca=COR[qid];
    if(ca==null||ca==="")return;
    if(ans[qid]!=null&&String(ans[qid])===String(ca))correct++;
  });
  var ratio=total>0?(correct/total):0;
  var pts=Math.round((ratio*C.puntajeMaximo)*10)/10;
  var ex=C.exigencia||0.6;
  var nota=ratio>=ex?(4+(ratio-ex)/(1-ex)*3):(1+(ratio/ex)*3);
  nota=Math.min(7,Math.max(1,Math.round(nota*10)/10));
  var pct=total>0?Math.round(ratio*100):0;
  var ap=ratio>=ex;
  var resultEl=document.getElementById("result");
  var html=(timeout?'<div style="font-size:2rem;margin-bottom:8px">⏰</div><p style="font-size:.9rem;font-weight:700;color:#dc2626;margin-bottom:14px">Se acabó el tiempo</p>':'');
  html+='<div class="res-icon">'+( ap?"🎉":"📚")+'</div>'+
    '<div class="res-score">'+correct+' / '+total+' correctas</div>'+
    '<div class="res-nota">Nota: <strong>'+nota.toFixed(1)+'</strong> · Puntaje: '+pts.toFixed(1)+' / '+C.puntajeMaximo+'</div>'+
    '<span class="res-badge '+( ap?"badge-ap":"badge-rp")+'">'+( ap?"✓ Aprobado":"✗ No aprobado")+'</span>'+
    '<div class="prog"><div class="prog-fill" style="width:'+pct+'%;background:'+( ap?"#16a34a":"#dc2626")+'"></div></div>'+
    '<p style="font-size:.8rem;color:#64748b;margin-bottom:12px">Logro: <strong>'+pct+'%</strong> (exigencia '+Math.round(ex*100)+'%)</p>';
  if(total>0)html+='<button class="btn-rev" onclick="_QZ.review()">Ver respuestas correctas</button>';
  resultEl.innerHTML=html;
  resultEl.classList.add("show");
  document.getElementById("sub-wrap").style.display="none";
  document.querySelectorAll(".q-block").forEach(function(b){b.style.pointerEvents="none";});
  resultEl.scrollIntoView({behavior:"smooth",block:"center"});
},
review:function(){
  QS.forEach(function(q,i){
    var tp=q.type||"choice";
    if(tp!=="choice"&&tp!=="truefalse")return;
    var qid=q.id||("q"+i);
    var ca=COR[qid];
    if(ca==null)return;
    var opts=q.options||[];if(tp==="truefalse"&&!opts.length)opts=["Verdadero","Falso"];
    opts.forEach(function(o,j){
      var el=document.getElementById("o"+i+"_"+j);if(!el)return;
      if(String(o)===String(ca)){el.classList.add("ok");}
      else if(el.classList.contains("sel")){el.classList.add("bad");}
    });
  });
  var btn=document.querySelector(".btn-rev");if(btn)btn.style.display="none";
}
};
// Start timer after module is defined
tick();
iv=setInterval(tick,1000);
return module;
})();
document.getElementById("lec-ov").addEventListener("click",function(e){if(e.target===this)_QZ.closeLec();});
</script>
